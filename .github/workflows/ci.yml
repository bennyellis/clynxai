# Continuous integration: every push and pull request is type-checked, unit-tested and built on Windows (the shipping platform) and macOS (compatibility), and the cloud
# server is tested against real Postgres and Redis. It publishes NOTHING (see release.yml, which only runs when a maintainer starts it).
name: CI
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # the browser download is skipped here: unit tests need no browser
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clynx
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: clynx_cloud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clynx" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://clynx:ci_password@localhost:5432/clynx_cloud_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      OPENAI_API_KEY: ci-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # Known-vulnerability review of the dependencies that ship (production only). Informational: a new advisory should be looked at, but must not block unrelated work.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: cloud
