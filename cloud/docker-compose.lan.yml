# CLYNX CLOUD AS A SERVER FOR OTHER COMPUTERS ON YOUR HOME/OFFICE NETWORK (a separate stack from the developer stack in docker-compose.yml; it has its own database).
#
#   * Only the API (which also serves the website) is reachable from the network, on ONE port (default 8788), bound to the host's LAN address you choose.
#   * PostgreSQL and Redis publish NO ports at all: they exist only on the private Docker network. Redis needs a password; Postgres needs its own password.
#   * Secrets come from .env.lan in %USERPROFILE%\ClynxLan (generated by deploy/windows/Initialize-ClynxLan.ps1; kept OUTSIDE the project folder, which may sync to OneDrive). Nothing secret is in this file.
#
# Use the scripts in deploy/windows (Start-ClynxLan.ps1 etc.); they set LAN_BIND for you. By hand:
#   $env:LAN_BIND = "10.0.0.81"; $env:CLYNX_ENV_FILE = "$env:USERPROFILE\ClynxLan\.env.lan"; docker compose -f docker-compose.lan.yml --env-file $env:CLYNX_ENV_FILE up -d --build
#
# This serves plain http. That is acceptable ONLY inside a network you trust. For internet access use docker-compose.https.yml (TLS in front) - never forward this port to the internet.
name: clynx-lan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run Initialize-ClynxLan.ps1 first}
      POSTGRES_DB: ${POSTGRES_DB:-clynx_cloud}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run Initialize-ClynxLan.ps1 first}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    mem_limit: 512m

  api:
    image: ${CLYNX_IMAGE:-clynx-lan-api:latest}
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: ${CLYNX_ENV_FILE:?use the scripts in deploy/windows}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clynx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clynx_cloud}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 8787
      # "true" only when a TLS tunnel/proxy on this PC forwards to the API (Enable-ClynxPrivateAccess.ps1 sets it): then the visitor address and https come from its headers
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      NODE_ENV: production
    ports:
      # the ONLY published port. LAN_BIND is the host's LAN address (set by Start-ClynxLan.ps1); never 0.0.0.0 on a computer that is also on another network.
      - "${LAN_BIND:-127.0.0.1}:${LAN_PORT:-8788}:8787"
    volumes:
      - releases_data:/data
    # migrations are idempotent (schema_migrations + an advisory lock), so running them on every start is safe
    command: sh -c "node dist/db/migrate.js && node dist/index.js"
    networks: [internal]
    mem_limit: 512m

  worker:
    image: ${CLYNX_IMAGE:-clynx-lan-api:latest}
    pull_policy: never # built by the api service above; never looked up in a registry
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    env_file: ${CLYNX_ENV_FILE:?use the scripts in deploy/windows}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clynx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clynx_cloud}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
    command: node dist/worker.js
    healthcheck:
      disable: true
    networks: [internal]
    mem_limit: 512m

networks:
  internal:
    internal: false # (Docker needs outbound access for the optional OpenAI/eBay/Stripe/email calls; nothing inbound is published except the API port above)

volumes:
  pg_data:
  redis_data:
  releases_data:
